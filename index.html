    const decode=(value)=>Uint8Array.from(atob(value),char=>char.charCodeAt(0));
    const form=document.querySelector('#unlock-form');
    const input=document.querySelector('#password');
    const button=document.querySelector('#unlock-button');
    const status=document.querySelector('#status');
    form.addEventListener('submit',async(event)=>{
      event.preventDefault();
      const password=input.value.trim();
      if(!/^\d{6}$/.test(password)){status.textContent='Enter the 6-digit visitor PIN.';input.focus();return;}
      button.disabled=true;button.textContent='Decrypting…';status.textContent='';
      try{
        const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
        const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)},key,decode(payload.ciphertext));
        const frame=document.createElement('iframe');
        frame.className='site-frame';frame.title='KNOWN UNKNOWNS website';frame.srcdoc=new TextDecoder().decode(clear);
        frame.addEventListener('load',()=>{if(location.hash){try{frame.contentWindow.location.hash=location.hash}catch{}}});
        document.body.replaceChildren(frame);
        document.title='KNOWN UNKNOWNS — with Lexx';
      }catch(error){
        status.textContent='That PIN did not open this transmission.';
        input.select();button.disabled=false;button.textContent='Unlock transmission →';
      }
    });
